name: STAR Fraud Training Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-validate-promote:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Display execution context
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"

      - name: Synchronize local project
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          git fetch origin
          git checkout master
          git pull origin master

      - name: Check Python environment
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe --version
          .\venv\Scripts\python.exe -c "import mlflow; print('MLflow', mlflow.__version__)"

      - name: Run local integration tests
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe -m pytest -m integration -v

      - name: Train and register candidate
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe -m StarGenAI.mlops.train_fraud_model

      - name: Display aliases after training
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe -m StarGenAI.mlops.show_aliases

      - name: Validate and promote candidate
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe -m StarGenAI.mlops.validate_and_promote_fraud_model

      - name: Verify promoted champion
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe -m StarGenAI.mlops.show_champion

      - name: Export champion summary
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"
          .\venv\Scripts\python.exe -m StarGenAI.mlops.export_champion_summary

      - name: Generate pipeline summary
        if: always()
        shell: powershell
        run: |
          Set-Location "C:\Users\lenovo\StarProject\backend"

          $summaryPath = $env:GITHUB_STEP_SUMMARY
          $championSummaryPath = "StarGenAI\mlops\champion_summary.json"

          $championVersion = "unknown"
          $championAlias = "unknown"
          $validationStatus = "unknown"
          $deploymentStatus = "unknown"

          if (Test-Path $championSummaryPath) {
              $champion = Get-Content $championSummaryPath -Raw |
                  ConvertFrom-Json

              $championVersion = $champion.version
              $championAlias = $champion.alias
              $validationStatus = $champion.validation_status
              $deploymentStatus = $champion.deployment_status
          }

          Add-Content -Path $summaryPath -Value "# STAR Fraud MLOps Pipeline"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "## Informations"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "| Élément | Valeur |"
          Add-Content -Path $summaryPath -Value "|---|---|"
          Add-Content -Path $summaryPath -Value "| Runner | $env:RUNNER_NAME |"
          Add-Content -Path $summaryPath -Value "| Branche | $env:GITHUB_REF_NAME |"
          Add-Content -Path $summaryPath -Value "| Exécution | $env:GITHUB_RUN_NUMBER |"
          Add-Content -Path $summaryPath -Value "| Commit | $env:GITHUB_SHA |"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "---"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "## Pipeline"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "✅ Tests d'intégration"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "✅ Entraînement terminé"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "✅ Modèle enregistré dans MLflow"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "✅ Version candidate créée"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "✅ Validation réussie"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "✅ Promotion du champion"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "---"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "## Champion actuel"
          Add-Content -Path $summaryPath -Value ""
          Add-Content -Path $summaryPath -Value "| Propriété | Valeur |"
          Add-Content -Path $summaryPath -Value "|---|---|"
          Add-Content -Path $summaryPath -Value "| Version | $championVersion |"
          Add-Content -Path $summaryPath -Value "| Alias | $championAlias |"
          Add-Content -Path $summaryPath -Value "| Validation | $validationStatus |"
          Add-Content -Path $summaryPath -Value "| Déploiement | $deploymentStatus |"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "---"
          Add-Content -Path $summaryPath -Value ""

          Add-Content -Path $summaryPath -Value "Pipeline terminé avec succès."