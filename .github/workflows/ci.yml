name: STAR MLOps CI

on:
  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Upgrade installation tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall app.py StarGenAI tests

      - name: Check required imports
        run: |
          python -c "import fastapi, pandas, sklearn, mlflow, dvc, evidently"
          python -c "print('Main imports are available')"

      - name: Check MLOps source files
        run: |
          python -m StarGenAI.mlops.check_mlops_assets

      - name: Run lightweight tests
        run: |
          python -m pytest tests/test_environment.py -v

      - name: Check DVC metadata
        run: |
          dvc status

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build